# Runs the test suite on every PR to main and on every push to main (#23).
# No secrets: tests marked `db` (real Databento access) are skipped by the
# pytest config in pyproject.toml, and data tests use the mock client.

name: tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

# Superseded runs are cancelled on PR branches only; every commit on main
# keeps its own check, even when two merges land in quick succession.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    # Windows too: two of us develop on it, and path handling (cache dirs,
    # ~/.databento_api_key) is where OS-specific bugs show up.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Test with pytest
      run: python -m pytest -q
